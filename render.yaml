# Render Blueprint — deploys the FastAPI service only (`backend/`).
# Cloud-first: no Python on your laptop required. After deploy, copy the service
# HTTPS URL → Vercel env BACKEND_URL (origin only, no /api). Set DATABASE_URL in
# Render Dashboard (Neon asyncpg URL, no ?sslmode= in URI).
# https://render.com/docs/infrastructure-as-code
#
# First deploy: Render prompts for DATABASE_URL when sync: false (secret).

services:
  - type: web
    name: alphatest-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
